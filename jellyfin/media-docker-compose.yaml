networks:
  servarrnetwork:
    name: servarrnetwork
volumes:
  jellyfin-config:
  jellyfin-cache:
  seerr-data:

services:
  jellyfin:
    image: docker.io/jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - /share/Public/anime:/anime
      - /share/Public/shows:/shows
      - /share/Public/movies:/movies
      - /share/Public/music:/music
      - /share/Public/youtube:/youtube
    networks:
      - servarrnetwork
  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    container_name: nzbget
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=100
      - TZ=Europe/Berlin
    volumes:
      - /share/Public/nzbget:/config
      - /share/Public/downloads:/data/downloads
    ports:
      - 6789:6789
    networks:
      - servarrnetwork

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=100
      - TZ=Europe/Berlin
    volumes:
      - /share/Public/sonarr:/config
      - /share/Public:/data
    ports:
      - 8989:8989
    networks:
      - servarrnetwork

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=100
      - TZ=Europe/Berlin
    volumes:
      - /share/Public/radarr:/config
      - /share/Public:/data
    ports:
      - 7878:7878
    networks:
      - servarrnetwork

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=100
      - TZ=Europe/Berlin
    volumes:
      - /share/Public/lidarr:/config
      - /share/Public:/data
    ports:
      - 8686:8686
    networks:
      - servarrnetwork

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Europe/Berlin
    ports:
      - 5055:5055
    volumes:
      - /share/Public/seerr:/app/config
    networks:
      - servarrnetwork
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
